<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Data KTP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 12px; border: none; }
        .card-header { border-radius: 12px 12px 0 0 !important; }
        .table th { white-space: nowrap; font-weight: 600; }
    </style>
</head>
<body>

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold text-primary"><i class="bi bi-person-vcard"></i> Manajemen Data KTP</h1>
        <p class="text-muted">Aplikasi Pendataan Kartu Tanda Penduduk berbasis Web</p>
    </div>

    <div id="alert-box" class="alert d-none shadow-sm mb-4"></div>

    <div class="card shadow-sm">
        <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0 text-dark"><i class="bi bi-table me-2 text-primary"></i>Daftar KTP</h5>
            <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#ktpModal" onclick="prepareAdd()">
                <i class="bi bi-plus-lg me-1"></i> Tambah Data KTP
            </button>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">No KTP</th>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th>Tgl Lahir</th>
                        <th>Kelamin</th>
                        <th class="text-center pe-4" style="width: 150px;">Aksi</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="ktpModal" tabindex="-1" aria-labelledby="ktpModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="ktpModalLabel"><i class="bi bi-pencil-square me-2"></i>Form Data KTP</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form id="ktpForm">
                <div class="modal-body p-4">
                    <input type="hidden" id="idKtp">

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nomorKtp" placeholder="Nomor KTP" required>
                        <label for="nomorKtp">Nomor KTP (NIK)</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="namaLengkap" placeholder="Nama Lengkap" required>
                        <label for="namaLengkap">Nama Lengkap</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="alamat" placeholder="Alamat" required>
                        <label for="alamat">Alamat Lengkap</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="date" class="form-control" id="tanggalLahir" required>
                        <label for="tanggalLahir">Tanggal Lahir</label>
                    </div>

                    <div class="form-floating mb-2">
                        <select class="form-select" id="jenisKelamin" required>
                            <option value="" disabled selected>Pilih Jenis Kelamin...</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                        <label for="jenisKelamin">Jenis Kelamin</label>
                    </div>
                </div>

                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary shadow-sm" id="btnSave">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
